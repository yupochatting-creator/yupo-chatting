name: Build YUPO Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Check website files
        run: |
          echo "Repository files:"
          ls -la
          echo "Checking icon:"
          test -f ./icon.png || (echo "ERROR: icon.png is missing from the checked-out commit" && exit 1)

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/yupo/chatting
          mkdir -p app/src/main/res/drawable-nodpi

          cp ./icon.png app/src/main/res/drawable-nodpi/ic_launcher.png

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "YUPOChatting"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.yupo.chatting'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.yupo.chatting'
                  minSdk 23
                  targetSdk 28
                  versionCode 2
                  versionName '1.1'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="YUPO Chatting"
                  android:icon="@drawable/ic_launcher"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name="com.yupo.chatting.MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/yupo/chatting/MainActivity.java <<'EOF'
          package com.yupo.chatting;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView web = new WebView(this);
                  web.getSettings().setJavaScriptEnabled(true);
                  web.setWebViewClient(new WebViewClient());
                  setContentView(web);

                  web.loadUrl("https://yupochatting-creator.github.io/yupo-chatting/");
              }
          }
          EOF

      - name: Build Android APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yupo-android-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
